<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-uBBVx2igJN1LR+/68xBm7Gg0mHi8sslaXCHZqlPxFAI='; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Open in Extra Cover</title>
<meta property="og:title" content="Open in Extra Cover">
<meta property="og:description" content="A Cricket 26 mod shared from Extra Cover. Click to open it in the app.">
<meta name="theme-color" content="#4A8BF5">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0E1116; color: #E8ECF1;
         font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { width: min(440px, calc(100% - 48px)); padding: 32px 30px; border-radius: 20px; text-align: center;
         background: #161B23; border: 1px solid #2A3140; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.02em; }
  p { margin: 0 0 22px; color: #A9B2BF; }
  a.btn { display: block; margin: 10px 0 0; padding: 12px 18px; border-radius: 12px; text-decoration: none;
          font-weight: 700; color: #fff; background: #4A8BF5; }
  a.btn.ghost { background: transparent; border: 1px solid #2A3140; color: #E8ECF1; }
  a.btn.hide { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening Extra Cover…</h1>
  <p id="lead">If nothing happens, open it with the button below.</p>
  <a class="btn" id="open" href="#">Open in Extra Cover</a>
  <a class="btn ghost hide" id="gb" href="#" rel="noopener noreferrer">View on GameBanana</a>
  <a class="btn ghost" href="../">Get Extra Cover</a>
</main>
<script>
// Chats only make http(s) links clickable, so share links point here and this
// page hands the extracover: link to the app (app/share-links.js reads it).
// Only digits (a mod) or a bounded EC1 code (a profile) are passed on.
(function () {
  var q = new URLSearchParams(location.search);
  var mod = q.get('mod'), profile = q.get('profile'), link = null;
  if (mod && /^\d{1,10}$/.test(mod)) {
    link = 'extracover://mod/' + mod;
    var gb = document.getElementById('gb');
    gb.href = 'https://gamebanana.com/mods/' + mod;
    gb.classList.remove('hide');
  } else if (profile && /^EC1\.[A-Za-z0-9_-]{4,3000}$/.test(profile)) {
    link = 'extracover://profile/' + profile;
    document.getElementById('title').textContent = 'Open this profile in Extra Cover';
  }
  var open = document.getElementById('open');
  if (!link) {
    document.getElementById('title').textContent = 'This link is not complete';
    document.getElementById('lead').textContent = 'Ask for the link again, or get Extra Cover below.';
    open.classList.add('hide');
    return;
  }
  open.href = link;
  location.href = link;
})();
</script>
</body>
</html>
