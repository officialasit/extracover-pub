# Deploy the standalone Astro site to the repository's GitHub Pages project path.
# Repository Settings > Pages > Source must be set to GitHub Actions.
name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  # Picks up new app releases: the build reads the newest download links.
  schedule:
    - cron: '17 */3 * * *'
  # Optional instant trigger from the releases repo (see docs/SEO.md).
  repository_dispatch:
    types: [release-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Optimized images, fonts and the social preview are committed with the site.
      - run: npm run build
        env:
          SITE_URL: 'https://officialasit.github.io'
          SITE_BASE: '/extracover-pub/'
          SITE_INDEXING: 'true'
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
